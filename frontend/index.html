<!doctype html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interview Coach · 模拟面试</title>
  <script>/* 在样式表加载前套用已保存的主题，避免闪一下 */
    try { if (localStorage.getItem("ic-theme") === "dark") document.documentElement.className = "dark"; } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/vendor/element-plus.css">
  <link rel="stylesheet" href="/static/vendor/element-plus-dark.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app" v-cloak>
<el-config-provider :locale="locale">
<div class="shell">

  <!-- ═════════ 左侧导航 ═════════ -->
  <aside class="side">
    <div class="side-brand" @click="nav('prep')">
      <span class="brand-glyph">IC</span>
      <span class="brand-text">
        <b>Interview Coach</b>
        <i>AI 模拟面试</i>
      </span>
    </div>

    <nav class="side-nav">
      <button :class="['nav-item', { on: page === 'prep' }]" @click="nav('prep')">
        <el-icon><icon-monitor></icon-monitor></el-icon>
        <span class="nav-label">工作台</span>
      </button>
      <button :class="['nav-item', { on: page === 'interview' }]" @click="nav('interview')">
        <el-icon><icon-chat-dot-round></icon-chat-dot-round></el-icon>
        <span class="nav-label">模拟面试</span>
        <span v-if="sessionId" class="nav-badge live mono">{{ elapsed }}</span>
      </button>
      <button :class="['nav-item', { on: page === 'intel' }]" @click="nav('intel')">
        <el-icon><icon-collection></icon-collection></el-icon>
        <span class="nav-label">情报库</span>
        <i v-if="kbStale" class="nav-dot" title="今天还没更新"></i>
      </button>
      <button :class="['nav-item', { on: page === 'records' }]" @click="nav('records')">
        <el-icon><icon-folder-opened></icon-folder-opened></el-icon>
        <span class="nav-label">面试记录</span>
        <span v-if="history.length" class="nav-badge mono">{{ history.length }}</span>
      </button>
      <button v-if="report" :class="['nav-item', { on: page === 'report' }]" @click="nav('report')">
        <el-icon><icon-data-analysis></icon-data-analysis></el-icon>
        <span class="nav-label">本场复盘</span>
      </button>
    </nav>

    <div class="side-foot">
      <el-tooltip :content="cfg.ready ? cfg.detail : '还没配置模型，点齿轮进设置'" placement="right">
        <div class="side-model" @click="openSettings">
          <i :class="['dot', cfg.ready ? 'ok' : 'bad']"></i>
          <span class="side-model-name mono">{{ cfg.ready ? (cfg.model || cfg.provider) : '未配置模型' }}</span>
        </div>
      </el-tooltip>
      <div class="side-acts">
        <el-tooltip :content="theme === 'dark' ? '切到日间' : '切到夜间'" placement="right">
          <button class="side-act" @click="toggleTheme">
            <el-icon><icon-sunny v-if="theme === 'dark'"></icon-sunny><icon-moon v-else></icon-moon></el-icon>
          </button>
        </el-tooltip>
        <el-tooltip content="设置" placement="right">
          <button class="side-act" @click="openSettings">
            <el-icon><icon-setting></icon-setting></el-icon>
          </button>
        </el-tooltip>
      </div>
    </div>
  </aside>

  <!-- ═════════ 主区 ═════════ -->
  <div class="stage">

    <!-- ───────── 工作台 ───────── -->
    <main v-if="page === 'prep'" class="panel pg workbench">
      <el-alert v-if="!cfg.ready" type="warning" :closable="false" show-icon class="gap-b"
                title="还没配置对话模型">
        <template #default>
          <span>{{ cfg.detail }}——填一个 API key 就能开始。</span>
          <el-button link type="warning" class="inline-link" @click="openSettings">打开设置</el-button>
        </template>
      </el-alert>

      <!-- 开始面试 -->
      <section class="hero-card">
        <div class="hero-main">
          <h1>开始一场模拟面试</h1>
          <p class="hero-sub">{{ resume.loaded ? '面试官会照着《' + resume.filename + '》逐条深挖' : '没传简历也能面，面试官会让你先讲项目' }}</p>
          <div class="hero-chips">
            <el-tag size="small" effect="plain" round>{{ round }}</el-tag>
            <el-tag size="small" effect="plain" round>{{ style }}风格</el-tag>
            <el-tag size="small" effect="plain" round>{{ level }}</el-tag>
            <el-tag v-if="resume.loaded" size="small" type="success" effect="plain" round>已带简历</el-tag>
            <el-tag v-if="ttsOn" size="small" effect="plain" round>语音朗读</el-tag>
          </div>
        </div>
        <div class="hero-cta">
          <el-button type="primary" size="large" class="start-btn"
                     :disabled="!cfg.ready" :loading="busy" @click="startInterview">
            <el-icon v-if="!busy" class="cta-ico"><icon-video-play></icon-video-play></el-icon>
            开始面试
          </el-button>
          <span v-if="sessionId" class="hero-resume-note">有一场进行中（{{ elapsed }}），点左侧「模拟面试」回去</span>
        </div>
      </section>
